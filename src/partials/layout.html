<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <meta name="theme-color" content="#015778">
  <link rel="canonical" href="{{pageUrl}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="406 Strong">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{pageUrl}}">
  <meta property="og:image" content="{{siteUrl}}/images/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{root}}favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="{{root}}images/406icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Josefin+Slab:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{root}}styles.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "406 Strong",
    "description": "ACSM-certified personal training, STOTT PILATES, TRX, and lifestyle coaching in Whitefish, Montana. In-studio and virtual sessions.",
    "url": "{{siteUrl}}/",
    "image": "{{siteUrl}}/images/og-image.jpg",
    "email": "{{email}}",
    "founder": { "@type": "Person", "name": "Sally Beaulieu", "jobTitle": "Certified Personal Trainer" },
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "1250 Baker Ave",
      "addressLocality": "Whitefish",
      "addressRegion": "MT",
      "postalCode": "59937",
      "addressCountry": "US"
    },
    "areaServed": "Flathead Valley, Montana"
  }
  </script>
  <script src="{{root}}site.js" defer></script>
</head>
<body>
  <a href="#main" class="sr-only z-[100] rounded-lg bg-white px-4 py-2 font-semibold focus:not-sr-only focus:fixed focus:top-3 focus:left-3">Skip to main content</a>
  {{> header}}
  <main id="main" tabindex="-1" class="outline-none">
{{content}}
  </main>
  {{> footer}}
</body>
</html>
