<header class="fixed inset-x-0 top-0 z-50 transition-[background-color,box-shadow,backdrop-filter] duration-300
               data-[scrolled]:bg-paper/85 data-[scrolled]:shadow-[0_1px_0_rgb(14_42_51/0.08)] data-[scrolled]:backdrop-blur-lg" data-header>
  <div class="wrap flex h-[4.5rem] items-center justify-between gap-6 md:h-20">
    <a href="{{root}}#top" class="shrink-0 rounded-md" aria-label="406 Strong home">
      <img src="{{root}}images/logo-240.webp" srcset="{{root}}images/logo-240.webp 1x, {{root}}images/logo-480.webp 2x"
           alt="" width="240" height="139" class="h-11 w-auto md:h-12">
    </a>

    <nav class="hidden items-center gap-7 lg:flex" aria-label="Main">
      <a href="{{root}}#training" class="nav-link" data-spy="training">Training</a>
      <a href="{{root}}#sally" class="nav-link" data-spy="sally">Meet Sally</a>
      <a href="{{root}}#stories" class="nav-link" data-spy="stories">Stories</a>
      <a href="{{root}}#outdoors" class="nav-link" data-spy="outdoors">Outdoors</a>
      <a href="{{root}}#faq" class="nav-link" data-spy="faq">FAQ</a>
    </nav>

    <div class="flex items-center gap-2">
      <a href="{{root}}#contact" class="btn btn-primary hidden min-h-11 px-5 text-[0.9375rem] sm:inline-flex">Free consultation</a>
      <button type="button" class="inline-flex size-12 items-center justify-center rounded-full text-ink transition hover:bg-ink/5 lg:hidden"
              aria-expanded="false" aria-controls="menu" data-menu-open>
        <span class="sr-only">Menu</span>
        <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- Mobile menu sheet -->
<div id="menu" class="fixed inset-0 z-[60] hidden flex-col bg-ink text-paper data-[open]:flex" role="dialog" aria-modal="true" aria-label="Menu" data-menu>
  <div class="wrap flex h-[4.5rem] items-center justify-between">
    <span class="font-display text-xl">406 Strong</span>
    <button type="button" class="inline-flex size-12 items-center justify-center rounded-full hover:bg-white/10" data-menu-close>
      <span class="sr-only">Close menu</span>
      <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <nav class="wrap flex flex-1 flex-col justify-center gap-1 pb-10" aria-label="Mobile">
    <a href="{{root}}#training" class="py-2 font-display text-4xl text-paper no-underline">Training</a>
    <a href="{{root}}#sally" class="py-2 font-display text-4xl text-paper no-underline">Meet Sally</a>
    <a href="{{root}}#stories" class="py-2 font-display text-4xl text-paper no-underline">Stories</a>
    <a href="{{root}}#outdoors" class="py-2 font-display text-4xl text-paper no-underline">Outdoors</a>
    <a href="{{root}}#faq" class="py-2 font-display text-4xl text-paper no-underline">FAQ</a>
    <a href="{{root}}#contact" class="btn btn-primary mt-8 self-start">Book a free consultation</a>
    <p class="mt-10 text-sm text-mist">1250 Baker Ave, Whitefish, MT<br><a href="mailto:{{email}}" class="text-paper">{{email}}</a></p>
  </nav>
</div>
